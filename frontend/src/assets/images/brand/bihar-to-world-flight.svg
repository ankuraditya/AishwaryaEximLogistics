    <!-- Mahavir Mandir / temple cluster inspired -->
    <g transform="translate(252 247)" stroke="url(#sky)" stroke-width="2.4">
      <path d="M0 167h145M15 167V82h47v85M83 167V68h47v99M21 82l18-61 17 61M90 68l16-66 18 66"/>
