    <g transform="translate(78 291)" stroke="url(#sky)" stroke-width="2.5">
      <path d="M0 123h99M13 123C14 61 34 21 50 4c18 19 36 59 37 119M29 123V88h42v35M39 88V70h22v18"/>
      <path d="M18 105h64M24 82h52M32 58h36"/>
