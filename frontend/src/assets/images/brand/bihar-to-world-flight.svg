      <path d="M0 210h100M17 210V79h66v131M10 79h80L76 58H24L10 79ZM34 58V25h32v33M42 25V5h16v20"/>
      <path d="M31 108h38M31 135h38M31 162h38M31 189h38M43 210v-26h14v26"/>
