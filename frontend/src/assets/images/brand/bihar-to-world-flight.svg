  <g transform="translate(590 270)" stroke="#F5F7F3" stroke-width="2.5" stroke-linecap="round" opacity=".9">
    <circle cx="92" cy="92" r="88" fill="#fff" fill-opacity=".035"/><ellipse cx="92" cy="92" rx="35" ry="88"/><path d="M4 92h176M17 48h150M17 136h150"/>
    <path d="M58 31c19 9 25 27 18 50-15 8-22 19-20 34M121 31c-18 17-19 33-2 49 21 10 24 28 10 53"/>
