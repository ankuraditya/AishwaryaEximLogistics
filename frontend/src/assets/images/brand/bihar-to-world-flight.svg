  <g transform="translate(487 309) rotate(17) scale(.72)" fill="#A9CE8F"><path d="M0 17 49 9 72 0l10 4-21 13 34 5c7 1 10 5 7 9-2 3-6 4-12 3l-31-5-12 28-9-2 3-30-31-5L0 17Z"/></g>

  <g fill="#fff" font-family="Arial, sans-serif"><text x="210" y="507" font-size="18" font-weight="700" letter-spacing="3">BIHAR</text><text x="623" y="401" font-size="15" font-weight="700" letter-spacing="2">TO THE WORLD</text></g>
</svg>
