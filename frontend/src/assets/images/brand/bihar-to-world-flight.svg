<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" fill="none">
  <defs>
    <linearGradient id="sky" x1="80" y1="90" x2="620" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#A9CE8F"/><stop offset="1" stop-color="#5C8D3A"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0C56B"/><stop offset="1" stop-color="#D58B2B"/></linearGradient>
  </defs>

  <!-- decorative orbit -->
  <g opacity=".32"><circle cx="290" cy="300" r="244" stroke="#A9CE8F" stroke-dasharray="3 14"/><circle cx="290" cy="300" r="212" stroke="#fff" stroke-opacity=".2"/><path d="M93 210c101-104 253-122 377-46" stroke="#D58B2B" stroke-dasharray="4 12"/></g>

  <!-- sunrise -->
  <circle cx="291" cy="300" r="148" fill="#fff" fill-opacity=".035"/><circle cx="291" cy="300" r="136" stroke="#D58B2B" stroke-opacity=".32" stroke-width="2"/>
  <circle cx="291" cy="300" r="112" stroke="#A9CE8F" stroke-opacity=".28" stroke-dasharray="2 10"/>

  <!-- original Bihar landmark skyline -->
  <g stroke-linecap="round" stroke-linejoin="round">
