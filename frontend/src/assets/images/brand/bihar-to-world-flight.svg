  <g stroke-linecap="round">
    <path d="M315 275C410 155 558 153 675 272" stroke="#F0C56B" stroke-width="3" stroke-dasharray="6 12"/>
    <path d="M320 305c105-54 220-37 301 42" stroke="#A9CE8F" stroke-width="2.5" stroke-dasharray="5 11"/>
    <path d="M315 330c93 62 209 78 318 27" stroke="#fff" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3 12"/>
  </g>

  <!-- aircraft -->
  <g transform="translate(480 163) rotate(22)" fill="#F5F7F3">
    <path d="M0 17 49 9 72 0l10 4-21 13 34 5c7 1 10 5 7 9-2 3-6 4-12 3l-31-5-12 28-9-2 3-30-31-5L0 17Z"/>
