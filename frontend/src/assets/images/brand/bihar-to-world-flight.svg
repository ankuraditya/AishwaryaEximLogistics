      <path d="M39 21V5M106 2v-17"/>
    </g>
    <!-- Patna bridge and river -->
    <g transform="translate(55 413)" stroke="#F5F7F3" stroke-opacity=".7" stroke-width="2">
      <path d="M0 18h385M23 18v-25M82 18v-25M141 18v-25M200 18v-25M259 18v-25M318 18v-25M377 18v-25"/>
      <path d="M0 53c40-22 80-22 120 0s80 22 120 0 80-22 120 0M18 76c35-17 70-17 105 0s70 17 105 0 70-17 105 0"/>
    </g>
    <!-- Madhubani accents -->
    <g transform="translate(105 120) rotate(-9 60 35)" stroke="#D58B2B" stroke-width="2">
      <path d="M0 35c34-41 78-41 112 0-34 41-78 41-112 0Z"/><circle cx="29" cy="32" r="4"/><path d="m112 35 40-29-9 29 9 29-40-29ZM47 35c14-16 33-16 48 0-15 16-34 16-48 0Z"/>
    </g>
    <g transform="translate(350 104)" stroke="#A9CE8F" stroke-width="2">
      <path d="M32 83C25 48 35 22 63 3M36 50C12 46 1 31 1 9c24 4 36 18 35 41ZM47 32c23-1 39-13 47-35-23-1-39 11-47 35Z"/>
      <circle cx="27" cy="87" r="11"/><circle cx="51" cy="79" r="11"/><circle cx="42" cy="101" r="11"/>
    </g>
  </g>

  <!-- Bihar marker -->
  <g><circle cx="291" cy="300" r="43" fill="#022963" stroke="#F0C56B" stroke-width="3"/><path d="m270 292 20-9 24 7 11 14-15 13-28-2-16-11 4-12Z" fill="#A9CE8F"/><circle cx="291" cy="300" r="5" fill="#F0C56B"/></g>

